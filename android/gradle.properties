org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

kotlin.code.style=official

# Building from WSL against a Windows drive: DrvFs does not implement the byte-range locks Gradle
# uses for its project cache, so `./gradlew` fails with "Cannot lock file hash cache". Redirect the
# cache to a Linux path instead of disabling it:
#   ./gradlew assembleDebug --project-cache-dir=$HOME/.cache/save-slot-gradle
