name: Run search and slot UX patch

on:
  pull_request:
    branches:
      - app-v1

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/search-slot-ux'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/search-slot-ux
          fetch-depth: 0

      - name: Extract prepared patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, pathlib, re
          source = pathlib.Path('.github/workflows/apply-search-slot-ux.yml').read_text(encoding='utf-8')
          match = re.search(r"printf '%s' '([^']+)' \| base64 --decode \| gzip --decompress", source)
          if not match:
              raise SystemExit('Encoded patch payload not found.')
          pathlib.Path('/tmp/apply-search-slot-ux.mjs').write_bytes(gzip.decompress(base64.b64decode(match.group(1))))
          PY

      - name: Run prepared patch
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node /tmp/apply-search-slot-ux.mjs 2>&1 | tee /tmp/apply-search-slot-ux.log

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: search-slot-ux-patch-diagnostics
          path: |
            /tmp/apply-search-slot-ux.mjs
            /tmp/apply-search-slot-ux.log
          if-no-files-found: error
          retention-days: 1

      - name: Stop on patch failure
        if: steps.patch.outcome != 'success'
        shell: bash
        run: exit 1

      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name 'Save Slot Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Improve search filters and 3D slot interaction'
          git push origin HEAD:feature/search-slot-ux
