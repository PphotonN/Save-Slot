name: Save Slot Verification Diagnostic

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Capture typecheck output
        id: typecheck
        shell: bash
        run: |
          set +e
          pnpm check > typecheck.log 2>&1
          status=$?
          cat typecheck.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture test output
        id: tests
        shell: bash
        run: |
          set +e
          pnpm test > test.log 2>&1
          status=$?
          cat test.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture acceptance output
        id: acceptance
        shell: bash
        run: |
          set +e
          pnpm test:e2e > e2e.log 2>&1
          status=$?
          cat e2e.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostic output
        uses: actions/upload-artifact@v6
        with:
          name: save-slot-verification-logs
          path: |
            typecheck.log
            test.log
            e2e.log
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 1

      - name: Fail when verification failed
        if: steps.typecheck.outputs.status != '0' || steps.tests.outputs.status != '0' || steps.acceptance.outputs.status != '0'
        run: exit 1
