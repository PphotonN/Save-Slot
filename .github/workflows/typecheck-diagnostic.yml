name: Save Slot Typecheck Diagnostic

on:
  push:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Capture typecheck output
        id: typecheck
        shell: bash
        run: |
          set +e
          pnpm check > typecheck.log 2>&1
          status=$?
          cat typecheck.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload typecheck output
        uses: actions/upload-artifact@v6
        with:
          name: save-slot-typecheck-log
          path: typecheck.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail when typecheck failed
        if: steps.typecheck.outputs.status != '0'
        run: exit 1
