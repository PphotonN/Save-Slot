name: Android artifacts

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 37 preview platform
        run: yes | sdkmanager --channel=3 "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace --no-daemon

      - name: Prepare deliverables
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/Save-Slot-filter-source-build.apk
          git archive --format=zip --output=artifacts/Save-Slot-filter-source-build-source.zip HEAD
          sha256sum artifacts/* | tee artifacts/SHA256SUMS.txt

      - name: Upload APK and source archive
        uses: actions/upload-artifact@v4
        with:
          name: save-slot-filter-source-build
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
