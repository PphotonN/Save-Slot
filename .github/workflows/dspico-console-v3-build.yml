name: DSpico Console v3 Build

on:
  push:
    branches:
      - dspico-console-v3-build
    paths:
      - 'dspico_console_v3/**'
      - '.github/workflows/dspico-console-v3-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-v1.16.0
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git python3 ca-certificates curl

      - name: Checkout patch repository
        uses: actions/checkout@v4
        with:
          ref: dspico-console-v3-build
          path: patchrepo

      - name: Checkout Pico Launcher Enhanced
        uses: actions/checkout@v4
        with:
          repository: rasalopa/pico-launcher-enhanced
          ref: enhanced
          submodules: recursive
          path: pico-launcher

      - name: Assemble and apply console patch
        run: |
          cat patchrepo/dspico_console_v3/chunk*.txt > /tmp/apply_console_v3.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/apply_console_v3.py')
          s = p.read_text()
          start = s.index("rel='arm9/source/romBrowser/views/AppBarView.h'")
          end = s.index("replace('arm9/source/romBrowser/views/RomBrowserAppBarView.cpp'", start)
          p.write_text(s[:start] + s[end:])
          PY
          python3 -m py_compile /tmp/apply_console_v3.py
          python3 /tmp/apply_console_v3.py pico-launcher
          python3 patchrepo/dspico_console_v3/fix_console_v3.py pico-launcher

      - name: Build launcher
        working-directory: pico-launcher
        run: make -j2

      - name: Stage artifact and emulators
        run: |
          mkdir -p artifact/_pico/emulators
          cp pico-launcher/LAUNCHER.nds artifact/_picoboot.nds
          cp pico-launcher/LICENSE.txt artifact/LICENSE_PICO_LAUNCHER.txt
          curl -L --fail --retry 3 -o artifact/_pico/emulators/GBARunner2.nds \
            https://github.com/Gericom/GBARunner2/releases/download/v20200812-131430_6e4ce45/GBARunner2_arm7dldi_ds.nds
          curl -L --fail --retry 3 -o /tmp/gameyob.zip \
            https://github.com/Stewmath/GameYob/releases/download/v0.5.2/gameyob.zip
          python3 - <<'PY'
          import zipfile, pathlib, shutil
          z=zipfile.ZipFile('/tmp/gameyob.zip')
          nds=[n for n in z.namelist() if n.lower().endswith('.nds')]
          if not nds: raise SystemExit('GameYob archive has no NDS binary')
          preferred=next((n for n in nds if pathlib.PurePosixPath(n).name.lower()=='gameyob.nds'), nds[0])
          with z.open(preferred) as src, open('artifact/_pico/emulators/GameYob.nds','wb') as dst:
              shutil.copyfileobj(src,dst)
          print('GameYob binary:', preferred)
          PY
          printf 'DSpico Console v3\nBuild from rasalopa/pico-launcher-enhanced + DSpico console frontend patch.\nBundled: GBARunner2 + GameYob.\n' > artifact/BUILD_INFO.txt

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: DSPico_Console_v3
          path: artifact/
          if-no-files-found: error
