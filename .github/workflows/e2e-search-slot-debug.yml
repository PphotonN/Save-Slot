name: Search Slot E2E Diagnostics

on:
  pull_request:
    branches: [app-v1]

permissions:
  contents: read

jobs:
  e2e-log:
    if: github.event.pull_request.head.ref == 'feature/search-slot-ux'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm exec playwright install --with-deps chromium
      - id: e2e
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e 2>&1 | tee search-slot-e2e.log
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: search-slot-e2e-diagnostics
          path: |
            search-slot-e2e.log
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 1
      - if: steps.e2e.outcome != 'success'
        run: exit 1
