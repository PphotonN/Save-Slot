name: Save Slot CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Bash launcher syntax
        run: bash -n start-save-slot.sh

      - name: Validate PowerShell launcher syntax
        shell: pwsh
        run: |
          $hasErrors = $false
          foreach ($path in @('scripts/bootstrap-windows.ps1', 'scripts/launch-windows.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $hasErrors = $true
              foreach ($parseError in $errors) {
                Write-Error "$path`: $($parseError.Message) at $($parseError.Extent.StartLineNumber):$($parseError.Extent.StartColumnNumber)"
              }
            }
          }
          if ($hasErrors) { exit 1 }

      - name: Normalize source formatting in the verification workspace
        run: pnpm format

      - name: Verify normalized formatting
        run: pnpm lint

      - name: Typecheck workspace
        run: pnpm check

      - name: Run unit and integration tests
        run: pnpm test

      - name: Build applications
        run: pnpm build

      - name: Build web application for a static subpath
        run: pnpm --filter @save-slot/web build
        env:
          SAVE_SLOT_BASE_PATH: /Save-Slot

  acceptance:
    name: Desktop, smartphone and offline PWA acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Normalize source formatting in the verification workspace
        run: pnpm format

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright acceptance tests
        run: pnpm test:e2e

  windows-startup:
    name: Windows portable first-launch smoke
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Bootstrap portable runtime and frozen dependencies
        shell: powershell
        run: |
          $root = (Resolve-Path '.').Path
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$root\scripts\bootstrap-windows.ps1" -ProjectRoot $root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Start and verify Library, API and Web
        shell: powershell
        run: |
          $root = (Resolve-Path '.').Path
          $node = Join-Path $root '.runtime\node\node.exe'
          $pnpm = Join-Path $root '.runtime\pnpm\pnpm.cmd'
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$root\scripts\launch-windows.ps1" -ProjectRoot $root -NodeExecutable $node -PnpmCommand $pnpm -SmokeTest
          exit $LASTEXITCODE
