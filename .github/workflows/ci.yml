name: Save Slot CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Normalize source formatting in the verification workspace
        run: pnpm format

      - name: Verify normalized formatting
        run: pnpm lint

      - name: Typecheck workspace
        run: pnpm check

      - name: Run unit and integration tests
        run: pnpm test

      - name: Build applications
        run: pnpm build

      - name: Build web application for a static subpath
        run: pnpm --filter @save-slot/web build
        env:
          SAVE_SLOT_BASE_PATH: /Save-Slot

  acceptance:
    name: Desktop, smartphone and offline PWA acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Normalize source formatting in the verification workspace
        run: pnpm format

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright acceptance tests
        run: pnpm test:e2e
