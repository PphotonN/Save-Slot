name: Save Slot v1 CI

on:
  push:
    branches:
      - app-v1
      - 'feature/**'
  pull_request:
    branches:
      - app-v1

permissions:
  contents: read

concurrency:
  group: save-slot-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Check formatting
        run: pnpm lint

      - name: Typecheck workspace
        run: pnpm check

      - name: Run unit tests
        run: pnpm test

      - name: Build applications
        run: pnpm build
