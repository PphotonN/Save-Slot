name: Apply search and slot UX update

on:
  push:
    paths:
      - .github/workflows/apply-search-slot-ux.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/search-slot-ux
          fetch-depth: 0

      - name: Apply guarded source transformations
        shell: bash
        run: |
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/apply-search-slot-ux.mjs
          node /tmp/apply-search-slot-ux.mjs

      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name 'Save Slot Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Improve search filters and 3D slot interaction'
          git push origin HEAD:feature/search-slot-ux
