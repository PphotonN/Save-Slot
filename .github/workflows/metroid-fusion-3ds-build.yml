name: Metroid Fusion 3DS test build

on:
  push:
    branches:
      - chatgpt/metroid-fusion-3ds-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    env:
      PATH: /opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: Checkout build helper
        uses: actions/checkout@v4

      - name: Install 3DS development packages
        shell: bash
        run: |
          set -euxo pipefail
          if command -v dkp-pacman >/dev/null 2>&1; then
            dkp-pacman -Syu --noconfirm --needed 3ds-dev || true
          elif command -v pacman >/dev/null 2>&1; then
            pacman -Syu --noconfirm --needed 3ds-dev || true
          fi
          command -v arm-none-eabi-gcc
          command -v cmake
          test -f "$DEVKITPRO/libctru/include/3ds.h"

      - name: Fetch and patch mGBA 3DS frontend
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/mgba
          git clone --depth 1 https://github.com/mgba-emu/mgba.git /tmp/mgba
          git -C /tmp/mgba rev-parse HEAD > "$GITHUB_WORKSPACE/mgba-upstream-commit.txt"
          python3 "$GITHUB_WORKSPACE/tools/metroidfusion3ds_patch.py" /tmp/mgba
          python3 "$GITHUB_WORKSPACE/tools/metroidfusion3ds_v05.py" /tmp/mgba
          python3 "$GITHUB_WORKSPACE/tools/metroidfusion3ds_v06.py" /tmp/mgba
          python3 "$GITHUB_WORKSPACE/tools/metroidfusion3ds_v07.py" /tmp/mgba
          python3 "$GITHUB_WORKSPACE/tools/metroidfusion3ds_v08.py" /tmp/mgba
          python3 "$GITHUB_WORKSPACE/tools/metroidfusion3ds_v09.py" /tmp/mgba

      - name: Configure mGBA for Nintendo 3DS
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S /tmp/mgba -B /tmp/mgba/build \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/mgba/src/platform/3ds/CMakeToolchain.txt \
            -DCMAKE_BUILD_TYPE=Release \
            -DBINARY_NAME=MetroidFusion3DS \
            -DM_CORE_GBA=ON \
            -DM_CORE_GB=ON \
            -DBUILD_QT=OFF \
            -DBUILD_SDL=OFF \
            -DBUILD_SHARED=OFF \
            -DBUILD_STATIC=ON \
            -DENABLE_DEBUGGERS=OFF \
            -DENABLE_GDB_STUB=OFF \
            -DENABLE_SCRIPTING=OFF \
            -DUSE_FFMPEG=OFF \
            -DUSE_LUA=OFF \
            -DUSE_SQLITE3=OFF \
            -DUSE_DISCORD_RPC=OFF \
            -DUSE_FREETYPE=OFF \
            -DUSE_LIBZIP=OFF \
            -DUSE_LZMA=OFF \
            -DUSE_JSON_C=OFF \
            -DUSE_ELF=OFF

      - name: Build 3DS ELF
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build /tmp/mgba/build --target MetroidFusion3DS.elf -j2
          find /tmp/mgba/build \( -name 'MetroidFusion3DS.elf' -o -name 'cia.rsf' \) -print

      - name: Build makerom if needed
        shell: bash
        run: |
          set -euxo pipefail
          if command -v makerom >/dev/null 2>&1; then
            echo "makerom already available: $(command -v makerom)"
            exit 0
          fi
          rm -rf /tmp/Project_CTR
          git clone --depth 1 https://github.com/3DSGuy/Project_CTR.git /tmp/Project_CTR
          cd /tmp/Project_CTR/makerom
          make deps -j2
          make -j2
          install -m 755 bin/makerom /usr/local/bin/makerom

      - name: Fetch 3dstool used by current mGBA forwarder generator
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/3dstool-dist /tmp/3dstool.tar.gz
          mkdir -p /tmp/3dstool-dist
          curl -L --fail --retry 3 \
            -o /tmp/3dstool.tar.gz \
            https://github.com/dnasdw/3dstool/releases/download/v1.2.6/3dstool_linux_x86_64.tar.gz
          tar -xzf /tmp/3dstool.tar.gz -C /tmp/3dstool-dist
          TOOL="$(find /tmp/3dstool-dist -type f -name 3dstool -print -quit)"
          test -n "$TOOL"
          chmod +x "$TOOL"
          install -m 755 "$TOOL" /usr/local/bin/3dstool

      - name: Package CCI / .3ds
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          ELF="$(find /tmp/mgba/build -name 'MetroidFusion3DS.elf' -print -quit)"
          RSF="$(find /tmp/mgba/build -name 'cia.rsf' -print -quit)"
          test -n "$ELF"
          test -n "$RSF"
          makerom -f cci \
            -o "$GITHUB_WORKSPACE/out/MetroidFusion3DS_Base.3ds" \
            -rsf "$RSF" \
            -target t \
            -elf "$ELF"
          cp "$ELF" "$GITHUB_WORKSPACE/out/MetroidFusion3DS.elf"
          cp "$RSF" "$GITHUB_WORKSPACE/out/MetroidFusion3DS.rsf"
          cp "$(command -v makerom)" "$GITHUB_WORKSPACE/out/makerom-linux-x86_64"
          cp "$(command -v 3dstool)" "$GITHUB_WORKSPACE/out/3dstool-linux-x86_64"

      - name: Package exact patched source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/mgba/build /tmp/mgba/.git
          mkdir -p /tmp/mgba/port-build-files
          cp "$GITHUB_WORKSPACE/tools/metroidfusion3ds_patch.py" /tmp/mgba/port-build-files/
          cp "$GITHUB_WORKSPACE/tools/metroidfusion3ds_v05.py" /tmp/mgba/port-build-files/
          cp "$GITHUB_WORKSPACE/tools/metroidfusion3ds_v06.py" /tmp/mgba/port-build-files/
          cp "$GITHUB_WORKSPACE/tools/metroidfusion3ds_v07.py" /tmp/mgba/port-build-files/
          cp "$GITHUB_WORKSPACE/tools/metroidfusion3ds_v08.py" /tmp/mgba/port-build-files/
          cp "$GITHUB_WORKSPACE/tools/metroidfusion3ds_v09.py" /tmp/mgba/port-build-files/
          cp "$GITHUB_WORKSPACE/.github/workflows/metroid-fusion-3ds-build.yml" /tmp/mgba/port-build-files/
          cp "$GITHUB_WORKSPACE/mgba-upstream-commit.txt" /tmp/mgba/port-build-files/
          tar -C /tmp -czf "$GITHUB_WORKSPACE/out/MetroidFusion3DS_Source_v0.9.tar.gz" mgba
          ls -lh "$GITHUB_WORKSPACE/out"

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: MetroidFusion3DS-v0.9-tools
          path: out/*
          if-no-files-found: error
